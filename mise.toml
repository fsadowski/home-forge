# Workstation tools for this repository, as decided in ADR-0002.
# Versions are exact; add a context's tools when its directory is created.
min_version = "2026.11.5"

[tools]
python = "3.15.2"
uv = "0.13.9"

[env]
# uv creates ansible/.venv from ansible/uv.lock (ADR-0004); mise only activates it.
_.python.venv = { path = "ansible/.venv", create = false }
# Keep uv on the Python that mise pins: never download one, use only what is on PATH.
UV_PYTHON_DOWNLOADS = "never"
UV_PYTHON_PREFERENCE = "only-system"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64"]
