# Python dependencies of the Host Configuration context, locked in uv.lock (ADR-0004).
[project]
name = "home-forge-ansible"
version = "0.0.0"
requires-python = "==3.15.*"
dependencies = [
    "ansible-core==2.22.0",
    "ansible-lint==26.11.0",
]

[tool.uv]
package = false
# Lock only the platform in use, matching mise.lock.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
